name: Publish OSINTNETAuditor Subpath

on:
  push:
    branches:
      - feature/new-ui-skins
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch, tag, or commit to publish
        required: false
        default: feature/new-ui-skins

permissions:
  contents: write

concurrency:
  group: publish-osintnetauditor-subpath
  cancel-in-progress: true

jobs:
  publish-subpath:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref || github.ref_name }}
          path: source
          fetch-depth: 1

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: target
          fetch-depth: 1

      - name: Sync files into main/OSINTNETAuditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $src = Join-Path $PWD 'source'
          $dstRoot = Join-Path $PWD 'target'
          $dst = Join-Path $dstRoot 'OSINTNETAuditor'

          if (Test-Path $dst) {
            Remove-Item -Recurse -Force $dst
          }
          New-Item -ItemType Directory -Path $dst | Out-Null

          $itemsToCopy = @(
            'index.html',
            'clippy.html',
            'txt-ui.html',
            'css',
            'js',
            'zebrus.png'
          )

          foreach ($item in $itemsToCopy) {
            $sourceItem = Join-Path $src $item
            if (Test-Path $sourceItem) {
              Copy-Item -Path $sourceItem -Destination $dst -Recurse -Force
            } else {
              Write-Host "Skipping missing item: $item"
            }
          }

          # Prevent Jekyll from stripping files/folders that start with underscore.
          New-Item -ItemType File -Path (Join-Path $dstRoot '.nojekyll') -Force | Out-Null

      - name: Commit and push changes to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location target

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add OSINTNETAuditor .nojekyll

          $changes = git status --porcelain
          if (-not $changes) {
            Write-Host 'No changes to commit.'
            exit 0
          }

          $sourceRef = '${{ github.event.inputs.source_ref || github.ref_name }}'
          $sourceSha = '${{ github.sha }}'
          $shortSha = if ($sourceSha.Length -ge 7) { $sourceSha.Substring(0, 7) } else { $sourceSha }

          git commit -m "chore(pages): publish OSINTNETAuditor from $sourceRef ($shortSha)"
          git push origin HEAD:main
