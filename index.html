<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dual UI View</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #151a22;
      --panel-2: #1b2230;
      --line: rgba(255, 255, 255, 0.12);
      --text: #e8edf5;
      --muted: rgba(232, 237, 245, 0.72);
      --handle: #4b5563;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(1200px 800px at 20% 0%, #182131 0%, var(--bg) 55%, #080b10 100%);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .shell {
      display: grid;
      grid-template-rows: auto 1fr;
      width: 100%;
      height: 100%;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      backdrop-filter: blur(12px);
    }

    .title {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .title strong {
      font-size: 15px;
      letter-spacing: 0.02em;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }

    .legend b {
      color: var(--text);
      font-weight: 600;
    }

    .stage {
      position: relative;
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      background: rgba(0, 0, 0, 0.24);
    }

    .pane {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      flex: 1 1 50%;
      background: var(--panel);
    }

    .pane.right {
      background: var(--panel-2);
    }

    .pane iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .splitter {
      position: relative;
      width: 12px;
      flex: 0 0 12px;
      cursor: col-resize;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.09));
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      user-select: none;
      touch-action: none;
    }

    .splitter::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 48px;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background: var(--handle);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
    }

    .splitter::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(125, 211, 252, 0.14), transparent);
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .splitter:hover::after,
    body.dragging .splitter::after {
      opacity: 1;
    }

    body.dragging,
    body.dragging * {
      cursor: col-resize !important;
      user-select: none !important;
    }

    @media (max-width: 900px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .pane {
        min-width: 180px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="title">
        <strong>Dual UI View</strong>
      </div>
      <div class="legend">
        <span><b>Left</b> old UI</span>
        <span><b>Right</b> new UI</span>
      </div>
    </header>

    <main class="stage" id="stage">
      <section class="pane left" id="leftPane" style="flex-basis: 50%;">
        <iframe src="OSINTNETAuditor/old-ui.html" title="Old UI"></iframe>
      </section>
      <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Przesuwana przedziałka"></div>
      <section class="pane right" id="rightPane" style="flex-basis: 50%;">
        <iframe src="OSINTNETAuditor/index.html" title="New UI"></iframe>
      </section>
    </main>
  </div>

  <script>
    (function () {
      var stage = document.getElementById('stage');
      var splitter = document.getElementById('splitter');
      var leftPane = document.getElementById('leftPane');
      var rightPane = document.getElementById('rightPane');
      var dragging = false;
      var minRatio = 0;
      var maxRatio = 1;
      var ratio = 0.5;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function applyRatio(nextRatio) {
        ratio = clamp(nextRatio, minRatio, maxRatio);
        leftPane.style.flexBasis = (ratio * 100).toFixed(4) + '%';
        rightPane.style.flexBasis = ((1 - ratio) * 100).toFixed(4) + '%';
      }

      function updateFromPointer(clientX) {
        var rect = stage.getBoundingClientRect();
        if (!rect.width) return;
        applyRatio((clientX - rect.left) / rect.width);
      }

      splitter.addEventListener('pointerdown', function (event) {
        dragging = true;
        document.body.classList.add('dragging');
        updateFromPointer(event.clientX);
        try { splitter.setPointerCapture(event.pointerId); } catch (_) {}
        event.preventDefault();
      });

      window.addEventListener('pointermove', function (event) {
        if (!dragging) return;
        updateFromPointer(event.clientX);
      });

      function endDrag() {
        dragging = false;
        document.body.classList.remove('dragging');
      }

      window.addEventListener('pointerup', function (event) {
        endDrag();
        try { splitter.releasePointerCapture(event.pointerId); } catch (_) {}
      });

      window.addEventListener('pointercancel', function () {
        endDrag();
      });

      window.addEventListener('resize', function () {
        applyRatio(ratio);
      });

      applyRatio(ratio);
    })();
  </script>
</body>
</html>
