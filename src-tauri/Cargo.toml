[package]
name = "ipscanner"
version = "2.6.0"
edition = "2021"

[[bin]]
name = "OSINTNETAuditor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tokio = { version = "1", features = ["net", "time", "rt-multi-thread", "macros", "io-util"] }
# WS<->TCP bridge for Topology's VNC desktop preview - browsers can't open
# raw TCP sockets, so the native process pipes bytes between a WebSocket
# (noVNC, browser side) and a plain TCP connection to the target's real VNC
# server (see vnc_bridge_task in main.rs).
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
# Already compiled in transitively (tauri, reqwest's "json" feature) - only
# added directly so LeakCheck's unconfirmed per-record schema can be parsed
# defensively via serde_json::Value instead of guessing field names.
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
dns-lookup = "3"
rfd = "0.14"
# Already resolved transitively at 0.22.1 (via reqwest/tauri-codegen) -
# promoted to a direct dependency for Agent Profile attachment BLOBs, which
# cross the Tauri IPC boundary as base64 (serde_json has no native binary
# encoding).
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
windows = { version = "0.62.2", features = ["Win32_NetworkManagement_IpHelper", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_NetworkManagement_Ndis", "Win32_System_Threading"] }
