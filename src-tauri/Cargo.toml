[package]
name = "ipscanner"
version = "2.8.6"
edition = "2021"

[[bin]]
name = "OSINTNETAuditor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tokio = { version = "1", features = ["net", "time", "rt-multi-thread", "macros", "io-util", "sync"] }
# WS<->TCP bridge for Topology's VNC desktop preview - browsers can't open
# raw TCP sockets, so the native process pipes bytes between a WebSocket
# (noVNC, browser side) and a plain TCP connection to the target's real VNC
# server (see vnc_bridge_task in main.rs).
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
# Already compiled in transitively (tauri, reqwest's "json" feature) - only
# added directly so LeakCheck's unconfirmed per-record schema can be parsed
# defensively via serde_json::Value instead of guessing field names.
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
dns-lookup = "3"
rfd = "0.14"
# Already resolved transitively at 0.22.1 (via reqwest/tauri-codegen) -
# promoted to a direct dependency for Agent Profile attachment BLOBs, which
# cross the Tauri IPC boundary as base64 (serde_json has no native binary
# encoding).
base64 = "0.22"
# HTTPS Auditor's certificate panel: reqwest has no API to hand back the
# peer certificate from a request it already made, so this does its own
# separate raw TLS handshake purely to inspect what cert the server
# presents (see fetch_certificate_info in main.rs). tokio-rustls and
# rustls-pki-types are already resolved transitively at these exact
# versions (via reqwest's rustls-tls feature) - promoted to direct
# dependencies rather than duplicating a second TLS stack. x509-parser is
# the one genuinely new dependency, for reading subject/issuer/validity
# out of the DER bytes rustls hands back (hand-rolling ASN.1 DER parsing
# for this, unlike md5_hex's textbook algorithm above, is real attack
# surface for parsing untrusted certs - not worth owning).
rustls = { version = "=0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "=0.26.4"
rustls-pki-types = "=1.14.1"
# NOTE: tauri-plugin-updater's own (separate, unrelated) reqwest
# dependency pulls in aws-lc-rs as a resolvable candidate regardless of
# the pins above - Cargo features are additive/unioned, never
# subtractive, so nothing declared here can turn it back off once any
# dependent's default features request it. It happens not to need
# compiling in a build that reuses this machine's current incremental
# cache, but aws-lc-sys's build script does NOT compile cleanly here (no
# NASM, plus an MSVC cl.exe /O2 vs /Od flag conflict even with NASM
# present) - a fully clean `cargo clean` + rebuild, or a build on a
# different machine/CI, may hit that failure again. Not solved as of
# 2026-08-24 - if it resurfaces, look at overriding tauri-plugin-
# updater's reqwest/hyper-rustls resolution via [patch.crates-io], not at
# these lines (already tried, doesn't work - see git blame).
x509-parser = "0.16"
rusqlite = { version = "0.31", features = ["bundled"] }
windows = { version = "0.62.2", features = ["Win32_NetworkManagement_IpHelper", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_NetworkManagement_Ndis", "Win32_System_Threading"] }
# Mail XSS Tester: sends the self-test email via the user's own Gmail
# app password (STARTTLS on port 587) - rustls to match reqwest's own TLS
# stack elsewhere in this file rather than pulling in a second TLS
# implementation. Exact feature names confirmed against `cargo check`
# output, not asserted from memory.
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
# Auto-update: Ed25519-signed, self-hosted manifest (latest.json uploaded to
# each GitHub Release) - no Microsoft Store, no paid Authenticode cert.
# Only meaningful for installer builds (NSIS/MSI); the portable zip has no
# installer to silently re-run, see update-check-runtime.js's isDesktop()
# gate for how that's handled on the JS side.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Community Catalog GitHub login: OAuth authorize opens in the SYSTEM
# browser (open_browser, existing command) since the app's own webview
# can't complete a provider redirect round-trip; the provider's final
# redirect to our custom URL scheme is what this plugin catches and hands
# back to the running app - see community-auth-runtime.js.
tauri-plugin-deep-link = "2"
# Windows always launches a SECOND process when the OS resolves our custom
# URL scheme back to the app (the original window is still running at that
# point, mid-login) - without this plugin that just opens a second, blank
# app window instead of completing the login in the original one. Must be
# registered FIRST in the Builder chain (see main.rs).
tauri-plugin-single-instance = "2"
